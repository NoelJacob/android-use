services:
  android:
    build: .
    image: android
    container_name: android
    privileged: true

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all

    devices:
      - /dev/kvm:/dev/kvm

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ports:
      - "5554:5554"
      - "5555:5555"

    volumes:
      - ./avd:/home/android/.android/avd

    shm_size: "8gb"

    # restart: unless-stopped